<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Monster GO Deluxe</title>
<style>
:root{--glass:rgba(255,255,255,.92);--shadow:0 7px 22px rgba(0,0,0,.22)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,Arial,sans-serif;background:#83c96d;color:#17202a}
button{font:inherit;border:0;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden;touch-action:none}
#world{position:absolute;width:3600px;height:2600px;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#9bd879}
#ground{position:absolute;inset:0;background:
linear-gradient(#9bd879,#92d171);
background-image:
linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),
linear-gradient(#9bd879,#92d171);
background-size:80px 80px,80px 80px,auto}
.path{position:absolute;background:#d9c89d;border:0;box-shadow:inset 0 0 0 3px #c3ae7d}
.path:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 32px,#fff6 33px 39px);opacity:.32}
.p1{left:0;top:1110px;width:100%;height:150px}
.p2{left:1725px;top:0;width:155px;height:100%}
.p3{left:0;top:560px;width:1725px;height:100px}
.p4{left:0;top:2030px;width:3600px;height:125px}
.p5{left:760px;top:0;width:125px;height:2600px}
.park{position:absolute;background:#75bc60;border:7px solid #63a750;border-radius:55px}
.pond{position:absolute;background:#55c6e6;border:9px solid #3b91b2;border-radius:50%}
.building{position:absolute;border-radius:16px;background:#e9a370;border:7px solid #b7744c;box-shadow:0 9px 0 #0002}
.building .door{position:absolute;bottom:0;left:50%;width:36px;height:55px;transform:translateX(-50%);background:#80533e;border-radius:10px 10px 0 0}
.building .window{position:absolute;width:35px;height:35px;background:#8ed8ee;border:4px solid #704d40;border-radius:5px}
.tree{position:absolute;width:58px;height:58px;border-radius:50%;background:#318d43;border:7px solid #236e37;box-shadow:0 7px 0 #1e5c31}
.bush{position:absolute;width:70px;height:36px;border-radius:50%;background:#4b9f45}
#player{position:absolute;width:82px;height:92px;z-index:70;display:flex;align-items:center;justify-content:center;font-size:45px;background:transparent;border:0;filter:drop-shadow(0 7px 4px #0006);transition:transform .08s;pointer-events:none}
#player:before{content:"";position:absolute;bottom:5px;width:50px;height:13px;border-radius:50%;background:#0005;filter:blur(2px);z-index:-1}
#player:after{content:"YOU";position:absolute;top:-23px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;letter-spacing:.5px;background:#315ee9;color:#fff;border:2px solid #fff;border-radius:12px;padding:3px 7px;box-shadow:0 3px 7px #0005;white-space:nowrap}
#player.walk{animation:playerWalk .22s infinite alternate}
@keyframes playerWalk{to{translate:0 -4px}}
#player.walk{animation:walk .25s infinite alternate}
@keyframes walk{to{translate:0 -4px}}
.monster{position:absolute;width:74px;height:74px;z-index:20;display:flex;align-items:center;justify-content:center;cursor:pointer}
.monster .bubble{position:absolute;inset:0;border-radius:50%;background:var(--c,#f4c);border:4px solid white;box-shadow:0 7px 13px #0004;display:flex;align-items:center;justify-content:center;font-size:41px;animation:idle 1.2s ease-in-out infinite}
.monster .shadow{position:absolute;bottom:-5px;width:48px;height:10px;background:#0003;border-radius:50%;filter:blur(3px);z-index:-1}
.monster .tag{position:absolute;top:77px;white-space:nowrap;background:#17202acc;color:white;border-radius:12px;padding:3px 8px;font-size:11px}.rarity{font-weight:900;letter-spacing:.3px}.battleStats{width:min(360px,88vw);background:#fffF;border:2px solid #fff;border-radius:16px;padding:12px;box-shadow:0 6px 18px #0002}.hpbar{height:10px;background:#ddd;border-radius:8px;overflow:hidden;margin-top:5px}.hpfill{height:100%;background:#4ec66b;transition:width .25s}.battleLog{max-width:min(420px,90vw);min-height:38px;text-align:center;background:#17202acc;color:#fff;border-radius:12px;padding:9px 12px;margin-top:8px;font-weight:700}
.monster .dot{position:absolute;right:-2px;top:-2px;width:13px;height:13px;border-radius:50%;background:#4fda68;border:2px solid white}
.monster.near .bubble{animation:hop .32s infinite alternate;filter:drop-shadow(0 0 9px #ffe36a)}
.monster.scared .bubble{animation:shake .18s infinite alternate}
@keyframes idle{0%,100%{transform:translateY(0) rotate(-2deg) scale(1)}50%{transform:translateY(-7px) rotate(2deg) scale(1.05)}}
@keyframes hop{from{transform:translateY(0) rotate(-7deg)}to{transform:translateY(-13px) rotate(7deg)}}
@keyframes shake{from{transform:translateX(-4px)}to{transform:translateX(4px)}}
.photo .bubble{overflow:hidden;background:white}.photo .bubble img{width:100%;height:100%;object-fit:cover;border-radius:50%;animation:photo 1s infinite alternate}
@keyframes photo{to{transform:scale(1.06) rotate(2deg)}}
#top{position:absolute;top:10px;left:10px;right:10px;z-index:100;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}
.glass{background:var(--glass);box-shadow:var(--shadow);border-radius:17px;padding:9px 12px}
.stats{min-width:160px}.level{font-weight:900}.xpbar{height:8px;background:#ddd;border-radius:8px;overflow:hidden;margin-top:5px}.xpfill{height:100%;width:0;background:#6756e8}
#weather{font-weight:800;pointer-events:auto}
#nearby{position:absolute;top:72px;right:10px;z-index:100;max-width:185px;font-size:12px;background:rgba(255,255,255,.94)}
#joystick{position:absolute;left:20px;bottom:20px;width:156px;height:156px;border-radius:50%;background:#ffffff42;border:4px solid #ffffffa8;z-index:120}
#stick{position:absolute;left:50%;top:50%;width:74px;height:74px;transform:translate(-50%,-50%);border-radius:50%;background:#405879e8;border:5px solid white;box-shadow:0 6px 12px #0004}
#buttons{position:absolute;right:15px;bottom:18px;z-index:120;display:grid;grid-template-columns:repeat(2,62px);gap:9px}
.icon{width:62px;height:62px;border-radius:19px;background:#fffffff0;box-shadow:var(--shadow);font-size:28px}
#toast{position:absolute;top:74px;left:50%;transform:translateX(-50%);z-index:300;background:#18232def;color:white;padding:11px 18px;border-radius:22px;opacity:0;transition:.25s;pointer-events:none}
#toast.show{opacity:1}
.overlay{position:absolute;inset:0;z-index:250;background:#0008;display:none;align-items:center;justify-content:center;padding:18px}
.panel{width:min(470px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:25px;padding:20px;box-shadow:0 20px 60px #0009}
.close{float:right;width:36px;height:36px;border-radius:50%;background:#eee}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.cell{background:#f2f4f7;border-radius:16px;padding:10px;text-align:center}.cell b{display:block;font-size:34px}
.small{font-size:12px;color:#5d6872}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:8px 0}
.action{padding:12px 16px;border-radius:15px;background:#fff;box-shadow:0 4px 12px #0003;font-weight:800}
.action.primary{background:#5b6fe8;color:white}
#encounter{position:absolute;inset:0;z-index:220;display:none;align-items:center;justify-content:center;flex-direction:column;background:
radial-gradient(circle at 50% 32%,#fff8,transparent 22%),
linear-gradient(#68c4ea 0%,#d8f3d1 55%,#80bf65 56%,#6dac58 100%)}
#encounter:after{content:"";position:absolute;left:0;right:0;bottom:24%;height:20px;background:#4f9b4b66;filter:blur(8px)}
.encTitle,.encInfo,.catchActions{position:relative;z-index:2}.encTitle{font-size:22px;font-weight:900}.encInfo{margin-top:6px}.encSprite{width:180px;height:180px;margin:18px 0;display:flex;align-items:center;justify-content:center;font-size:135px;filter:drop-shadow(0 14px 7px #5558);animation:encfloat 1.1s infinite alternate}
.encSprite img{width:175px;height:175px;object-fit:cover;border-radius:50%;border:8px solid white;box-shadow:0 12px 25px #0005}
@keyframes encfloat{to{transform:translateY(-15px) rotate(3deg)}}
.catchActions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
#aim{position:absolute;inset:0;z-index:4;pointer-events:none;display:none}
#aim .reticle{position:absolute;width:100px;height:100px;border:3px dashed #fff;border-radius:50%;left:50%;top:54%;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 3px #000)}
#ballFly{position:absolute;z-index:10;font-size:35px;display:none}
#rain,#night{position:absolute;inset:0;z-index:80;pointer-events:none;transition:.5s}
#rain{opacity:0;background:repeating-linear-gradient(105deg,transparent 0 18px,#fff5 19px 21px)}
#night{opacity:0;background:#101e55}
.minimap{position:absolute;right:10px;top:150px;width:145px;height:105px;background:#91cc77dd;border:4px solid white;border-radius:15px;z-index:95;box-shadow:var(--shadow);overflow:hidden}
.minimap .mroad{position:absolute;background:#d7c693}.minimap .mp{position:absolute;width:8px;height:8px;background:#4778ee;border:2px solid white;border-radius:50%}.minimap .mm{position:absolute;width:6px;height:6px;background:#ef4f50;border-radius:50%}
#mission{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:110;background:#ffffffdc;padding:8px 13px;border-radius:15px;box-shadow:var(--shadow);font-size:12px;font-weight:800}
@media(max-width:600px){#nearby{max-width:145px}.minimap{display:none}.stats{min-width:140px}.icon{width:57px;height:57px}.buttons{grid-template-columns:repeat(2,57px)}}

/* Pixel-art RPG skin */
:root{--shadow:4px 4px 0 #23412b66!important}
*{image-rendering:pixelated; -webkit-font-smoothing:none}
body{font-family:ui-monospace,Consolas,monospace!important;background:#8ccc6c!important}
.glass,.panel,.action,.icon,.cell,.battleStats,#mission,#nearby,.minimap{border-radius:3px!important;border:3px solid #293c32!important;box-shadow:4px 4px 0 #293c3270!important}
.path{border-radius:0!important}
.building{border-radius:2px!important;box-shadow:5px 5px 0 #355d3588!important}
.tree,.bush,.park,.pond{filter:none!important}
.monster .bubble{border-radius:4px!important;border:4px solid #263b31!important;box-shadow:4px 4px 0 #293c3270!important;filter:none!important}
.monster .tag{border-radius:2px!important;border:2px solid #293c32!important;font-family:ui-monospace,Consolas,monospace!important}
#player{position:fixed!important;left:50%!important;top:50%!important;width:66px!important;height:76px!important;z-index:100000!important;display:flex!important;align-items:center!important;justify-content:center!important;font-size:46px!important;background:#f8e6a4!important;border:4px solid #293c32!important;border-radius:4px!important;box-shadow:5px 5px 0 #293c3270!important;filter:none!important;opacity:1!important;visibility:visible!important;pointer-events:none!important;transform:translate(-50%,-50%)!important;animation:none!important}
#player:before{content:"";position:absolute;bottom:-9px;width:36px;height:8px;border-radius:0;background:#293c3277;filter:none;z-index:-1}
#player:after{content:"YOU";position:absolute;top:-25px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;background:#fff5b8;color:#263b31;border:3px solid #293c32;border-radius:2px;padding:2px 5px;white-space:nowrap;box-shadow:2px 2px 0 #293c3270}
#encounter{font-family:ui-monospace,Consolas,monospace!important;background:linear-gradient(#83c8ef 0 49%,#b9df8c 49% 60%,#6eae55 60%)!important}
#encounter:after{display:none}
.encSprite{filter:none!important;animation:none!important;text-shadow:4px 4px 0 #263b3144}
.action.primary{background:#e84e4e!important;border:3px solid #293c32!important;border-radius:3px!important}
@media(max-width:600px){#player{width:58px!important;height:66px!important;font-size:39px!important}}

</style>
</head>

function makeWorld(){
  const buildings=document.getElementById('buildings');
  const trees=document.getElementById('trees');
  const bushes=document.getElementById('bushes');

  // Fixed neighbourhood blocks keep the map readable instead of randomly cluttered.
  const buildingSpots=[
    [120,180,230,165],[430,180,230,165],[1120,150,240,175],[1450,150,220,175],
    [1950,120,240,175],[2270,120,230,175],[2820,160,240,175],[3140,160,230,175],

    [120,1480,230,170],[450,1480,230,170],[1120,1470,240,175],[1450,1470,220,175],
    [1950,1500,240,170],[2280,1500,230,170],[2820,1480,240,175],[3140,1480,230,175],
    [1120,2210,240,170],[1450,2210,220,170],[1950,2200,240,170],[2290,2200,230,170]
  ];
  buildingSpots.forEach(([x,y,w,h])=>{
    const b=document.createElement('div');
    b.className='building';
    b.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
    b.innerHTML='<div class="door"></div><div class="window" style="left:18px;top:25px"></div><div class="window" style="right:18px;top:25px"></div>';
    buildings.appendChild(b);
  });

  // Deliberately placed trees create park borders and open walking space.
  const treeSpots=[
    [90,90],[190,90],[290,90],[390,90],[490,90],[590,90],
    [90,440],[190,440],[290,440],[390,440],[490,440],[590,440],
    [900,130],[1000,130],[1100,130],[1200,130],
    [900,450],[1000,450],[1100,450],[1200,450],
    [2400,520],[2500,520],[2600,520],[2700,520],[2800,520],
    [2400,900],[2500,900],[2600,900],[2700,900],[2800,900],
    [120,1880],[220,1880],[320,1880],[420,1880],[520,1880],
    [900,1880],[1000,1880],[1100,1880],[1200,1880],
    [2400,2050],[2500,2050],[2600,2050],[2700,2050],[2800,2050],
    [3100,2050],[3200,2050],[3300,2050]
  ];
  treeSpots.forEach(([x,y])=>{
    const t=document.createElement('div');
    t.className='tree';
    t.style.cssText=`left:${x}px;top:${y}px`;
    trees.appendChild(t);
  });

  const bushSpots=[
    [690,230],[690,330],[820,230],[820,330],
    [2680,220],[2780,220],[2680,330],[2780,330],
    [650,1570],[750,1570],[650,1680],[750,1680],
    [3000,1120],[3120,1120],[3000,1230],[3120,1230]
  ];
  bushSpots.forEach(([x,y])=>{
    const b=document.createElement('div');
    b.className='bush';
    b.style.cssText=`left:${x}px;top:${y}px`;
    bushes.appendChild(b);
  });
}

function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1900)}
function addXP(n){xp+=n;while(xp>=level*100){xp-=level*100;level++;balls+=3;toast('🎉 Trainer level '+level+'! +3 Pokéballs')}document.getElementById('xp').textContent=xp;document.getElementById('level').textContent=level;document.getElementById('need').textContent=level*100;document.getElementById('xpfill').style.width=(xp/(level*100)*100)+'%';saveGame()}
function rarityRoll(){const total=kinds.reduce((a,k)=>a+k.weight,0);let r=Math.random()*total;for(const k of kinds){r-=k.weight;if(r<=0)return k}return kinds[0]}
function hpFor(k){return Math.round(k.base+(level-1)*2+Math.random()*7)}
function rarityXP(r){return ({Common:25,Uncommon:40,Rare:65,Epic:95,Legendary:150,Mythical:250})[r]||25}
function updateBattleStats(){if(!activeBattle)return;const b=activeBattle,k=b.kind;document.getElementById('battleStats').innerHTML=`<div class="row"><b>${k.emoji} ${k.name}</b><span class="rarity" style="color:${rarityColor[k.rarity]}">${k.rarity}</span></div><div class="small">${k.type} type · Lv ${b.level}</div><div class="row"><span>Wild HP</span><b>${Math.max(0,b.hp)}/${b.maxHp}</b></div><div class="hpbar"><div class="hpfill" style="width:${Math.max(0,b.hp)/b.maxHp*100}%;background:${b.hp/b.maxHp<.3?'#ed5757':'#4ec66b'}"></div></div><div class="row"><span>Partner</span><b>${b.partner?b.partner.emoji+' '+b.partner.name:'No partner yet'}</b></div>${b.partner?`<div class="small">Partner HP: ${Math.max(0,b.partner.hp)}/${b.partner.maxHp}</div><div class="hpbar"><div class="hpfill" style="width:${Math.max(0,b.partner.hp)/b.partner.maxHp*100}%;background:#4ec66b"></div></div>`:''}`;}
function collision(x,y){
return [...document.querySelectorAll('.building')].some(b=>{let r={x:+b.style.left,y:+b.style.top,w:b.offsetWidth,h:b.offsetHeight};return x+27>r.x&&x-27<r.x+r.w&&y+27>r.y&&y-27<r.y+r.h})
}
const mons=[];
function spawn(n=20){
for(let i=0;i<n;i++){let k={...rarityRoll()};let el=document.createElement('div');let x=120+Math.random()*(W-240),y=120+Math.random()*(H-240);el.className='monster';el.style.left=(x-37)+'px';el.style.top=(y-37)+'px';el.dataset.x=x;el.dataset.y=y;el.kind=k;el.vx=(Math.random()-.5)*k.speed;el.vy=(Math.random()-.5)*k.speed;el.timer=60+Math.random()*180;el.innerHTML=`<div class="shadow"></div><div class="bubble" style="--c:${k.color}">${k.emoji}</div><span class="dot"></span><span class="tag">${k.name}</span>`;el.onclick=()=>encounter(el);monstersEl.appendChild(el);mons.push(el)}
if(false && SPECIAL_IMAGE){let k={name:'Swingster',emoji:'🛝',type:'Special',rarity:'Rare',color:'#62d7a2',speed:.8,weight:1,base:35};let el=document.createElement('div');let x=600,y=730;el.className='monster photo';el.style.left=(x-37)+'px';el.style.top=(y-37)+'px';el.dataset.x=x;el.dataset.y=y;el.kind=k;el.vx=.45;el.vy=.25;el.timer=100;el.innerHTML=`<div class="shadow"></div><div class="bubble"><img src="${SPECIAL_IMAGE}"></div><span class="dot"></span><span class="tag">Swingster • Rare</span>`;el.onclick=()=>encounter(el);monstersEl.appendChild(el);mons.push(el)}
}
function moveMons(){
for(const m of mons){if(!m.isConnected)continue;let x=+m.dataset.x,y=+m.dataset.y,d=Math.hypot(x-px,y-py);m.timer--;if(d<230){m.classList.add('near');if(d<115)m.classList.add('scared');else m.classList.remove('scared');let dx=x-px,dy=y-py,l=Math.max(1,d);m.vx+=dx/l*.012;m.vy+=dy/l*.012;if(d<100){m.vx*=.94;m.vy*=.94}}else{m.classList.remove('near','scared');if(m.timer<=0){let a=Math.random()*6.283,s=m.kind.speed*.65;m.vx=Math.cos(a)*s;m.vy=Math.sin(a)*s;m.timer=70+Math.random()*180}}
if(x<80)m.vx=Math.abs(m.vx);if(x>W-80)m.vx=-Math.abs(m.vx);if(y<80)m.vy=Math.abs(m.vy);if(y>H-80)m.vy=-Math.abs(m.vy);let l=Math.hypot(m.vx,m.vy),mx=1.5;if(l>mx){m.vx=m.vx/l*mx;m.vy=m.vy/l*mx}
let nx=clamp(x+m.vx,70,W-70),ny=clamp(y+m.vy,70,H-70);if(collision(nx,ny)){m.vx*=-1;m.vy*=-1}else{x=nx;y=ny}
m.dataset.x=x;m.dataset.y=y;m.style.left=(x-37)+'px';m.style.top=(y-37)+'px';if(Math.abs(m.vx)>.05)m.querySelector('.bubble').style.transform=`scaleX(${m.vx<0?-1:1})`}
}
function camera(){world.style.transform=`translate(calc(-50% + ${innerWidth/2-px}px),calc(-50% + ${innerHeight/2-py}px))`}
function nearby(){let a=mons.filter(m=>m.isConnected).map(m=>({m,d:Math.hypot(+m.dataset.x-px,+m.dataset.y-py)})).sort((a,b)=>a.d-b.d).slice(0,3);document.getElementById('nearText').innerHTML=a.map(v=>`${v.m.kind.emoji} ${v.m.kind.name} ${Math.round(v.d)}m`).join('<br>')||'None';let mini=document.getElementById('miniMons');mini.innerHTML=a.map(v=>{let x=clamp(v.m.dataset.x/W*145,2,140),y=clamp(v.m.dataset.y/H*105,2,100);return `<i class="mm" style="left:${x}px;top:${y}px"></i>`}).join('');let mp=document.getElementById('miniPlayer');mp.style.left=clamp(px/W*145,2,140)+'px';mp.style.top=clamp(py/H*105,2,100)+'px'}
function tick(now){let dt=Math.min(40,now-last);last=now;time+=dt;let moving=Math.hypot(joy.x,joy.y)>.05;if(moving){let nx=clamp(px+joy.x*speed,40,W-40),ny=clamp(py+joy.y*speed,40,H-40);if(!collision(nx,py))px=nx;if(!collision(px,ny))py=ny;player.classList.add('walk');if(Math.abs(joy.x)>.2)facing=joy.x>0?1:-1}else player.classList.remove('walk');player.style.left='50%';
player.style.top='50%';
player.style.transform=`translate(-50%,-50%) scaleX(${facing})`;
moveMons();camera();nearby();requestAnimationFrame(tick)}
const joystick=document.getElementById('joystick'),stick=document.getElementById('stick');
function setJoy(x,y){let r=joystick.getBoundingClientRect(),dx=x-(r.left+r.width/2),dy=y-(r.top+r.height/2),max=39,d=Math.hypot(dx,dy);if(d>max){dx=dx/d*max;dy=dy/d*max}stick.style.left=`calc(50% + ${dx}px)`;stick.style.top=`calc(50% + ${dy}px)`;joy.x=dx/max;joy.y=dy/max}
function resetJoy(){joy.x=joy.y=0;joy.active=false;stick.style.left=stick.style.top='50%'}
joystick.onpointerdown=e=>{joy.active=true;joystick.setPointerCapture(e.pointerId);setJoy(e.clientX,e.clientY)};joystick.onpointermove=e=>{if(joy.active)setJoy(e.clientX,e.clientY)};joystick.onpointerup=resetJoy;joystick.onpointercancel=resetJoy;
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='w'||e.key==='ArrowUp')joy.y=-1;if(k==='s'||e.key==='ArrowDown')joy.y=1;if(k==='a'||e.key==='ArrowLeft')joy.x=-1;if(k==='d'||e.key==='ArrowRight')joy.x=1});addEventListener('keyup',e=>{if(['w','a','s','d','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))resetJoy()});

function encounter(el){
 const d=Math.hypot(+el.dataset.x-px,+el.dataset.y-py);
 if(d>145){toast('👣 Walk closer to '+el.kind.name);return}
 current=el;turnBusy=false;catchAttempts=0;
 const k=el.kind;seen.add(k.name);
 const partner=caught.length?{...caught[0],hp:caught[0].hp||caught[0].maxHp||30,maxHp:caught[0].maxHp||caught[0].hp||30}:null;
 activeBattle={kind:k,level:Math.max(1,level+Math.floor(Math.random()*3)-1),maxHp:hpFor(k),hp:0,partner,partnerMax:partner?.maxHp||0};
 activeBattle.hp=activeBattle.maxHp;
 document.getElementById('encounter').style.display='flex';
 document.getElementById('encTitle').textContent='A wild '+k.name+' appeared!';
 const sp=document.getElementById('encSprite');
 sp.innerHTML=el.classList.contains('photo')?`<img src="${SPECIAL_IMAGE}">`:k.emoji;
 document.getElementById('encInfo').textContent='Choose a move, weaken it, then throw a Poké Ball.';
 document.getElementById('battleLog').textContent='A wild '+k.name+' is ready to battle!';
 document.getElementById('fightBtn').disabled=!partner;
 document.getElementById('fightBtn').style.opacity=partner?1:.55;
 updateBattleStats();saveGame();
}
function battleFinish(message){document.getElementById('battleLog').textContent=message;turnBusy=false;updateBattleStats()}
function wildAttack(){
 if(!activeBattle||!activeBattle.partner)return;
 const b=activeBattle,p=b.partner;
 const damage=3+Math.floor(Math.random()*7)+Math.floor(b.level/3);
 p.hp=Math.max(0,p.hp-damage);
 if(p.hp<=0){battleFinish(`${b.kind.name} hit back for ${damage}! Your partner fainted — use a berry or run.`);document.getElementById('fightBtn').disabled=true}
 else battleFinish(`${b.kind.name} counterattacked for ${damage} damage!`);
 saveGame();
}
document.getElementById('fightBtn').onclick=()=>{
 const b=activeBattle;if(!b||turnBusy)return;
 if(!b.partner){toast('Catch a creature first to battle');return}
 if(b.partner.hp<=0){toast('Your partner has fainted!');return}
 turnBusy=true;
 const damage=5+Math.floor(Math.random()*10)+Math.floor(level/2);
 b.hp=Math.max(1,b.hp-damage);
 document.getElementById('battleLog').textContent=`${b.partner.emoji} ${b.partner.name} used a move for ${damage} damage!`;
 updateBattleStats();
 setTimeout(()=>{if(activeBattle){wildAttack();turnBusy=false}},650);
};
function leave(){document.getElementById('encounter').style.display='none';current=null;activeBattle=null;turnBusy=false}
document.getElementById('escape').onclick=leave;
document.getElementById('useBerry').onclick=()=>{
 if(berries<=0)return toast('🍓 No berries left');
 berries--;
 if(activeBattle&&activeBattle.partner){activeBattle.partner.hp=Math.min(activeBattle.partner.maxHp,activeBattle.partner.hp+15);document.getElementById('battleLog').textContent='Your partner recovered 15 HP!'}
 bonus=.18;updateBattleStats();sync();toast('🍓 Berry used — heals your partner and boosts catch chance!');saveGame();
};
document.getElementById('throwBall').onclick=()=>{
 if(!current||!activeBattle||turnBusy)return;
 if(balls<=0){toast('🔴 No Pokéballs left');return}
 const battleAtThrow=activeBattle, wildAtThrow=current;
 balls--;sync();saveGame();turnBusy=true;
 const fly=document.getElementById('ballFly');
 fly.style.display='block';fly.style.left='50%';fly.style.top='72%';
 try{fly.animate([{transform:'translate(-50%,-50%) scale(1)'},{transform:'translate(-50%,-50%) scale(.8) translateY(-220px)'},{transform:'translate(-50%,-50%) scale(.55) translateY(-170px)'}],{duration:450,fill:'forwards'});}catch(e){}
 setTimeout(()=>{
  fly.style.display='none';
  if(activeBattle!==battleAtThrow||current!==wildAtThrow){turnBusy=false;return}
  const b=activeBattle,k=b.kind;
  catchAttempts++;
  const rarityBase={Common:.82,Uncommon:.70,Rare:.56,Epic:.43,Legendary:.30,Mythical:.22}[k.rarity]??.65;
  const weakened=1-Math.max(0,b.hp)/Math.max(1,b.maxHp);
  const chance=Math.min(.98,rarityBase+weakened*.55+bonus+Math.min(.20,(catchAttempts-1)*.10));
  bonus=0;
  document.getElementById('battleLog').textContent=`You threw a Poké Ball! Catch chance: ${Math.round(chance*100)}%.`;
  if(Math.random()<chance||catchAttempts>=3){
   const c={...k,level:b.level,maxHp:k.base+Math.floor(Math.random()*7),hp:k.base+Math.floor(Math.random()*7),caughtAt:Date.now()};
   c.hp=c.maxHp;caught.push(c);
   coins+=k.rarity==='Mythical'?100:k.rarity==='Legendary'?60:k.rarity==='Epic'?30:10;
   addXP(rarityXP(k.rarity));document.getElementById('missionCount').textContent=Math.min(3,caught.length);
   document.getElementById('battleLog').textContent=`✨ Gotcha! ${k.name} was caught!`;
   toast(`✨ ${k.rarity} ${k.name} caught! +${rarityXP(k.rarity)} XP`);
   if(caught.length===3){coins+=50;toast('🏆 First mission complete! +50 coins')}
   wildAtThrow.remove();const idx=mons.indexOf(wildAtThrow);if(idx>=0)mons.splice(idx,1);
   sync();saveGame();
   setTimeout(()=>{if(activeBattle===battleAtThrow)leave();spawn(1);},1000);
  }else{
   document.getElementById('battleLog').textContent=`Oh no! ${k.name} broke free. Try again!`;
   if(b.partner&&b.partner.hp>0)wildAttack();
   turnBusy=false;updateBattleStats();saveGame();
  }
 },480);
};
function modal(title,body){document.getElementById('panel').innerHTML=`<button class="close" onclick="closeModal()">✕</button><h2>${title}</h2>${body}`;document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}
document.getElementById('bag').onclick=()=>modal('🎒 Inventory',`<div class="grid"><div class="cell"><b>🔴</b>Pokéballs<br>${balls}</div><div class="cell"><b>🍓</b>Berries<br>${berries}</div><div class="cell"><b>🪙</b>Coins<br>${coins}</div></div><h3>Party (${Math.min(6,caught.length)}/6)</h3>${caught.slice(0,6).map((x,i)=>`<div class="row"><span>${x.emoji} ${x.name} <small>Lv ${x.level||1}</small></span><b>${x.hp??x.maxHp??x.base??25}/${x.maxHp??x.base??25} HP</b></div>`).join('')||'<p>No creatures yet. Find one and catch it!</p>'}<p class="small">Berries heal your first partner and increase the next catch chance. Progress saves automatically.</p>`);
document.getElementById('dex').onclick=()=>{let c={};caught.forEach(x=>c[x.name]=(c[x.name]||0)+1);modal('📖 Creature Dex',`<p>${Object.keys(c).length}/${kinds.length+1} species discovered.</p><div class="grid">${kinds.concat([{name:'Swingster',emoji:'🛝',rarity:'Rare'}]).map(x=>`<div class="cell"><b>${c[x.name]?x.emoji:'❔'}</b>${c[x.name]?x.name:'Unknown'}<br>${c[x.name]||0} caught</div>`).join('')}</div>`)}
document.getElementById('map').onclick=()=>modal('🗺️ Map',`<p><b>Explore the neighbourhood</b></p><p>🟫 Roads &nbsp; 🟩 Parks &nbsp; 🟦 Water &nbsp; 🏠 Buildings</p><p>Your blue marker on the mini-map shows your position. Red dots show nearby creatures.</p><p><b>Rarity:</b> Common · Uncommon · Rare · Epic · Legendary · Mythical</p><p>Tip: fight to weaken wild creatures before throwing a Poké Ball for a better catch chance.</p><button class="action primary" onclick="closeModal()">Continue exploring</button>`);
document.getElementById('shop').onclick=()=>modal('🛒 Shop',`<div class="row"><span>🔴 5 Pokéballs — 20 coins</span><button class="action" onclick="buyBalls()">Buy</button></div><div class="row"><span>🍓 3 Berries — 15 coins</span><button class="action" onclick="buyBerries()">Buy</button></div><p class="small">Coins are earned from catches and missions.</p>`);
function buyBalls(){if(coins>=20){coins-=20;balls+=5;sync();toast('🔴 +5 Pokéballs')}else toast('Not enough coins')}function buyBerries(){if(coins>=15){coins-=15;berries+=3;sync();toast('🍓 +3 Berries')}else toast('Not enough coins')}function sync(){document.getElementById('coins').textContent=coins;document.getElementById('balls').textContent=balls}
document.getElementById('battle').onclick=()=>modal('⚔️ Training Battle',`<p>Choose a caught creature to train.</p>${caught.length?caught.map((x,i)=>`<div class="row"><span>${x.emoji} ${x.name}</span><button class="action" onclick="train(${i})">Train</button></div>`).join(''):'<p class="small">Catch a creature first.</p>'}`);
function train(i){addXP(20);coins+=5;sync();toast('⚔️ Training complete! +20 XP +5 coins');closeModal()}
document.getElementById('settings').onclick=()=>modal('⚙️ Settings',`<div class="row"><span>💾 Save progress</span><button class="action primary" onclick="saveGame();toast('Progress saved!')">Save now</button></div><div class="row"><span>🔄 Reset game</span><button class="action" onclick="if(confirm('Reset all saved progress?')){localStorage.removeItem('neighborhoodPokemonRPG');location.reload()}">Reset</button></div><p class="small">Progress saves automatically in this browser. Keyboard: WASD / arrow keys. Mobile: drag the joystick.</p>`);

const weatherNames=['☀️ Clear','☁️ Cloudy','🌧️ Rain','🌤️ Partly cloudy','🌙 Cool night'];
function changeWeather(){weather=(weather+1)%weatherNames.length;document.getElementById('weather').textContent=weatherNames[weather];document.getElementById('rain').style.opacity=weather===2?.58:0;if(weather===4){night=true;document.getElementById('night').style.opacity=.22}else{night=false;document.getElementById('night').style.opacity=0}toast('Weather changed')}
setInterval(changeWeather,35000);

makeWorld();loadGame();spawn(26);sync();addXP(0);camera();toast('🗺️ Explore, battle, and catch them all!');requestAnimationFrame(tick);
</script>
</div>
